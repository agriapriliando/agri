<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Spiral unit repeated 4 times -->
    <g id="dayakPetal">
      <!-- Main curve outwards -->
      <path d="M200,160 C200,90 250,70 280,100 C310,130 290,180 240,180 C210,180 210,150 230,140 C245,135 255,150 245,160" 
            stroke="#14b8a6" stroke-width="4" stroke-linecap="round" fill="none"/>
      <!-- Inner accent red branch -->
      <path d="M200,140 C210,80 260,80 270,110 C280,140 250,155 230,140" 
            stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Outer gold flare -->
      <path d="M200,100 C230,50 290,70 310,110" 
            stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="280" cy="100" r="5" fill="#fde047"/>
      <polygon points="200,50 208,65 200,60 192,65" fill="#dc2626"/>
    </g>
  </defs>

  <!-- Outer Ring with Dayak Dots & Rays -->
  <circle cx="200" cy="200" r="185" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,6" opacity="0.7"/>
  <circle cx="200" cy="200" r="170" stroke="#14b8a6" stroke-width="3" opacity="0.8"/>
  <circle cx="200" cy="200" r="155" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- 4 Rotated Petals (N, E, S, W) -->
  <use href="#dayakPetal" transform="rotate(0 200 200)"/>
  <use href="#dayakPetal" transform="rotate(90 200 200)"/>
  <use href="#dayakPetal" transform="rotate(180 200 200)"/>
  <use href="#dayakPetal" transform="rotate(270 200 200)"/>

  <!-- Intermediate 4 small diagonal motifs (NE, SE, SW, NW) -->
  <g transform="rotate(45 200 200)">
    <line x1="200" y1="200" x2="200" y2="70" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
    <circle cx="200" cy="75" r="7" fill="#ef4444" stroke="#fde047" stroke-width="2"/>
    <line x1="200" y1="200" x2="200" y2="330" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
    <circle cx="200" cy="325" r="7" fill="#ef4444" stroke="#fde047" stroke-width="2"/>
    <line x1="200" y1="200" x2="70" y2="200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
    <circle cx="75" cy="200" r="7" fill="#ef4444" stroke="#fde047" stroke-width="2"/>
    <line x1="200" y1="200" x2="330" y2="200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
    <circle cx="325" cy="200" r="7" fill="#ef4444" stroke="#fde047" stroke-width="2"/>
  </g>

  <!-- Central Dayak Eye (Bunga Terung Heart) -->
  <circle cx="200" cy="200" r="45" fill="#062828" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="200,165 225,200 200,235 175,200" fill="#dc2626" stroke="#fde047" stroke-width="2"/>
  <!-- Central Spiral Eye -->
  <path d="M200,200 C206,194 212,198 210,204 C208,210 200,210 196,204 C192,196 200,188 208,190" 
        stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="200" cy="200" r="3" fill="#ffffff"/>
</svg>
