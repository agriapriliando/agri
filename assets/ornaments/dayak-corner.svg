<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Outer Corner border lines -->
  <path d="M0,35 L0,0 L35,0" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <path d="M0,60 L0,0 L60,0" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Dayak Corner Spiral Motifs -->
  <!-- Primary Golden Horn Spiral -->
  <path d="M5,5 C25,5 45,15 45,35 C45,50 30,55 20,45 C15,40 20,30 30,35" 
        stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Secondary Red Inner Frond -->
  <path d="M5,5 C5,25 15,45 35,45 C50,45 55,30 45,20 C40,15 30,20 35,30" 
        stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Accent Tosca Dot and Diamond -->
  <polygon points="12,12 18,12 18,18 12,18" fill="#14b8a6" transform="rotate(45 15 15)"/>
  <circle cx="45" cy="15" r="3" fill="#fde047"/>
  <circle cx="15" cy="45" r="3" fill="#fde047"/>
</svg>
