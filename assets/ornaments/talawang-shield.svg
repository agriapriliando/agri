<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4646"/>
      <stop offset="50%" stop-color="#0d6e6e"/>
      <stop offset="100%" stop-color="#073030"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="toscaGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Talawang Hexagon Shape -->
  <polygon points="100,6 188,75 188,345 100,414 12,345 12,75" 
           fill="url(#shieldGrad)" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Inner Border Line -->
  <polygon points="100,18 176,80 176,338 100,400 24,338 24,80" 
           fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/>

  <!-- Top Crown Ornament (Paruh Burung Enggang / Stylized Motif) -->
  <path d="M100,24 C115,45 145,55 160,40 C145,70 120,65 100,85 C80,65 55,70 40,40 C55,55 85,45 100,24 Z" 
        fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>

  <!-- Center Central Diamond / Eye -->
  <polygon points="100,170 135,210 100,250 65,210" fill="url(#redGrad)" stroke="#fde047" stroke-width="3"/>
  <circle cx="100" cy="210" r="14" fill="#092f2f" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="100" cy="210" r="6" fill="#2dd4bf"/>

  <!-- Upper Dayak Spirals (Ukiran Sulur Kamang / Belitan Akar) -->
  <!-- Right Upper Spiral -->
  <path d="M100,120 C125,100 155,105 160,130 C165,155 140,175 120,165 C105,155 115,135 130,140 C140,145 140,155 135,155" 
        fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M100,105 C130,85 160,95 168,125" 
        fill="none" stroke="url(#redGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Upper Spiral (Mirrored) -->
  <path d="M100,120 C75,100 45,105 40,130 C35,155 60,175 80,165 C95,155 85,135 70,140 C60,145 60,155 65,155" 
        fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M100,105 C70,85 40,95 32,125" 
        fill="none" stroke="url(#redGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Central Red Accent Ribbons -->
  <path d="M100,85 L100,170" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M100,250 L100,335" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Lower Dayak Spirals -->
  <!-- Right Lower Spiral -->
  <path d="M100,300 C125,320 155,315 160,290 C165,265 140,245 120,255 C105,265 115,285 130,280 C140,275 140,265 135,265" 
        fill="none" stroke="url(#toscaGlow)" stroke-width="4" stroke-linecap="round"/>
  <path d="M100,315 C130,335 160,325 168,295" 
        fill="none" stroke="url(#redGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Lower Spiral (Mirrored) -->
  <path d="M100,300 C75,320 45,315 40,290 C35,265 60,245 80,255 C95,265 85,285 70,280 C60,275 60,265 65,265" 
        fill="none" stroke="url(#toscaGlow)" stroke-width="4" stroke-linecap="round"/>
  <path d="M100,315 C70,335 40,325 32,295" 
        fill="none" stroke="url(#redGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bottom Crown Ornament -->
  <path d="M100,396 C115,375 145,365 160,380 C145,350 120,355 100,335 C80,355 55,350 40,380 C55,365 85,375 100,396 Z" 
        fill="url(#redGrad)" stroke="#fde047" stroke-width="1.5"/>

  <!-- Side Grips / Chevron Accents -->
  <polygon points="12,185 24,195 12,205" fill="#f59e0b"/>
  <polygon points="12,215 24,225 12,235" fill="#ef4444"/>
  <polygon points="188,185 176,195 188,205" fill="#f59e0b"/>
  <polygon points="188,215 176,225 188,235" fill="#ef4444"/>
</svg>
